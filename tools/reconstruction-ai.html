<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre>
<script type="module">
import {reconstructBackground,packReconstruction,unpackReconstruction} from '../src/js/reconstruction.js';
import {identifyDepthImage} from '../src/js/depth.js';
import {sampleOcclusion,OCCLUSION_VERSION} from '../src/js/occlusion.js';
const output=document.getElementById('result');
try{
  const canvas=document.createElement('canvas');canvas.width=384;canvas.height=256;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#285b9c';ctx.fillRect(0,0,384,256);
  ctx.fillStyle='#efcf31';ctx.fillRect(144,52,96,152);
  // Give each run a fresh image identity while retaining the cached model,
  // so this checks the inference worker as well as subsequent disk reuse.
  const nonce=new Uint8Array(12);crypto.getRandomValues(nonce);
  for(let x=0;x<4;x++){ctx.fillStyle=`rgb(${nonce[x*3]},${nonce[x*3+1]},${nonce[x*3+2]})`;ctx.fillRect(x,0,1,1);}
  const bitmap=await createImageBitmap(canvas),depth={w:128,h:86,data:new Float32Array(128*86).fill(.15)};
  for(let y=17;y<69;y++)for(let x=48;x<80;x++)depth.data[y*128+x]=.9;
  await identifyDepthImage(bitmap,await new Promise(r=>canvas.toBlob(r)));
  const start=performance.now(),result=await reconstructBackground(bitmap,depth,status=>output.textContent='RUNNING '+status);
  if(!result?.rgb.length)throw Error('No reconstructed background');
  if(result.thickness?.length!==depth.w*depth.h||result.edgeWeight?.length!==depth.w*depth.h||!result.edgeWeight.some(v=>v>0))throw Error('Fresh AI result missing automatic thickness');
  const packed=packReconstruction(result),restored=unpackReconstruction(packed);
  for(const key of ['rgb','owner','thickness','edgeWeight'])if(!restored[key].every((v,i)=>v===result[key][i]))throw Error('Cache round trip failed: '+key);
  const cached=await reconstructBackground(bitmap,depth);if(cached!==result)throw Error('Repeated build reran AI');
  const blob=await new Promise(r=>canvas.toBlob(r)),reopened=await createImageBitmap(blob);await identifyDepthImage(reopened,blob);
  for(let i=0;i<50;i++){if((await(await caches.open(`dv-hidden-background-v${OCCLUSION_VERSION}`)).keys()).length)break;await new Promise(r=>setTimeout(r,20));}
  const reopenStart=performance.now();let saved=false;
  const disk=await reconstructBackground(reopened,depth,s=>saved=s.includes('saved'));
  if(!saved||!disk.rgb.every((v,i)=>v===result.rgb[i]))throw Error('Reopened wallpaper did not reuse disk cache');
  const reopenMs=performance.now()-reopenStart;reopened.close();
  const cloud=sampleOcclusion(result,1.5,400000);if(cloud.rands.length>40000||!cloud.rands.length)throw Error('Point budget failed');
  // The hidden layer must receive inferred background, not duplicate the yellow foreground.
  let blue=0,total=0;for(let i=0;i<result.owner.length;i++)if(result.owner[i]>=0){total++;if(result.rgb[i*3+2]>result.rgb[i*3])blue++;}
  if(blue/total<.6)throw Error('Foreground colours were copied instead of reconstructing background: '+blue/total);
  output.textContent=`PASS: real MI-GAN ${(performance.now()-start).toFixed(0)} ms; ${cloud.rands.length} capped hidden points; ${(100*blue/total).toFixed(0)}% background colour; cache round trip, memory reuse and reopened wallpaper ${reopenMs.toFixed(0)} ms.`;
  bitmap.close();
}catch(err){output.textContent='FAIL: '+(err.stack||err);}
</script>
