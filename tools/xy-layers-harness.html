<!doctype html>
<meta charset="utf-8">
<title>Swirl and Breathe GPU regression</title>
<canvas id="cloud" style="width:320px;height:320px"></canvas>
<pre id="result">Running…</pre>
<script type="module">
import { VisualScene } from '../src/js/scene.js';
import { getAll } from '../src/js/settings.js';
const out = document.querySelector('#result');
try {
  const scene = new VisualScene(document.querySelector('#cloud'));
  scene.renderer.setSize(320, 320, false);
  const positions = [], colors = [], rands = [];
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    positions.push((x - 15.5) / 40, (y - 15.5) / 40, 0.2);
    colors.push(0.3, 0.5, 0.7);
    rands.push(0);
  }
  scene.setCloud({ positions: new Float32Array(positions), colors: new Float32Array(colors),
    rands: new Float32Array(rands), aspect: 1, count: rands.length });
  const base = { ...getAll(), depthScale: 0, depthMove: 0, xyMove: 0, cursorRipple: false,
    musicParallax: 0, motionSpeed: 0, intensity: 1, quietMovement: 1, energyResponse: 1,
    overscan: 1, sizePulse: 0, boost: 0, hueReaction: 0, vibrancyPulse: 0,
    motionWave: 0, motionRipple: 0, motionBands: 0, motionDrift: 0,
    motionSwirl: 0, motionBreathe: 0, motionSweep: 0 };
  const gl = scene.renderer.getContext();
  function frame(patch, amp = 0.7) {
    scene.applySettings({ ...base, ...patch });
    scene.waveTime = 1;
    scene.xyTime = 0;
    scene.loudEma = 1;
    scene.render({ bands: new Float32Array(scene.bandCount).fill(amp), energy: 1, loud: 1 }, 0);
    const pixels = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
    gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('GPU readback failed');
    return pixels;
  }
  function changed(a, b) {
    let n = 0;
    for (let i = 0; i < a.length; i += 4) {
      if (a[i] !== b[i] || a[i+1] !== b[i+1] || a[i+2] !== b[i+2]) n++;
    }
    return n;
  }
  const resting = frame({});
  const swirl = frame({ motionSwirl: 1 });
  const breathe = frame({ motionBreathe: 1 });
  const both = frame({ motionSwirl: 1, motionBreathe: 1 });
  const checks = {
    swirlWithXYZero: changed(resting, swirl),
    breatheWithXYZero: changed(resting, breathe),
    breatheAddsToSwirl: changed(swirl, both),
    swirlAddsToBreathe: changed(breathe, both),
  };
  for (const [key, n] of Object.entries(checks)) if (n < 500) throw new Error(`${key}: only ${n} pixels moved`);
  if (changed(frame({}, 0), frame({ motionSwirl: 1, motionBreathe: 1 }, 0)) !== 0) {
    throw new Error('Layers moved without band audio');
  }
  out.textContent = 'PASS: actual GPU output changes with XY move 0, both layers combine, silence stays still.\n'
    + JSON.stringify(checks, null, 2);
} catch (error) {
  out.textContent = `FAIL: ${error.stack}`;
  console.error(error);
}
</script>
