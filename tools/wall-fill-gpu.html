<!doctype html><meta charset="utf-8"><canvas id="gl"></canvas><pre id="result">RUNNING</pre>
<script type="module">
import {VisualScene} from '../src/js/scene.js';
import {getAll} from '../src/js/settings.js';
import {sampleImageToCloud} from '../src/js/sampler.js';
import {buildCloud} from '../src/js/cloud-builder.js';
import {prepareOcclusion} from '../src/js/occlusion.js';
import {estimateFillThickness} from '../src/js/fill-thickness.js';
import {animatedSample} from '../src/js/framing-motion.js';
try{
 const canvas=document.createElement('canvas');canvas.width=384;canvas.height=256;
 canvas.getContext('2d').fillStyle='#806040';canvas.getContext('2d').fillRect(0,0,384,256);
 const bitmap=await createImageBitmap(canvas),depth={w:96,h:64,data:new Float32Array(96*64).fill(.15)};
 for(let y=0;y<64;y++)for(let x=48;x<96;x++)depth.data[y*96+x]=.9;
 const reconstruction=prepareOcclusion(depth,2.5);delete reconstruction.mask;reconstruction.rgb=new Uint8Array(96*64*3).fill(120);
 Object.assign(reconstruction,estimateFillThickness(depth,reconstruction));
 const options={reconstruction,wallFillPointLimit:10000,smartDepthBands:true,bands:20,bandMap:'depth'};
 const direct=sampleImageToCloud(bitmap,depth,40000,.5,options),cloud=await buildCloud(bitmap,depth,40000,.5,options);
 for(const [key,array] of Object.entries(direct.walls))if(array.length!==cloud.walls[key].length||!array.every((v,i)=>v===cloud.walls[key][i]))throw Error('Wall worker mismatch '+key);
 const scene=new VisualScene(document.getElementById('gl'));scene.renderer.setSize(400,300,false);scene.camera.aspect=4/3;scene.camera.position.set(.5,0,2);scene.camera.lookAt(0,0,0);scene.camera.updateProjectionMatrix();
 const settings={...getAll(),...options,occludedBackground:true,gapFillForegroundLimit:true,gapFillBrightness:.5,gapFillThicknessBias:1,depthScale:.6,depthShape:0,bandDistribution:0,invertBands:false,intensity:0,boost:0,hueReaction:0,hueCycle:0};
 scene.setCloud(cloud);scene.applySettings(settings);scene.uniforms.uCursor.value.set(0,0,0);scene.uniforms.uSize.value=2;
 scene.points.visible=false;scene.fillPoints.visible=false;scene.reconstructionPoints.visible=false;
 const gl=scene.renderer.getContext(),pixels=new Uint8Array(400*300*4),draw=()=>{
  scene.camera.updateMatrixWorld();scene.renderer.render(scene.scene,scene.camera);gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  if(gl.getError())throw Error('WebGL error');let min=400,max=-1;
  for(let y=0;y<300;y++)for(let x=0;x<400;x++)if(pixels[(y*400+x)*4]>0){min=Math.min(min,x);max=Math.max(max,x);}
  return {min,max};
 };
 const a=draw();if(a.max<0)throw Error('Real silhouette wall did not render');
 const geometry=scene.wallPoints.geometry;
 scene.applySettings({...settings,gapFillThicknessBias:.25});const thin=draw();
 scene.applySettings({...settings,gapFillThicknessBias:2.5});const wide=draw();
 if(wide.max-wide.min<=thin.max-thin.min+2)throw Error('Bias changed density rather than endpoint: '+JSON.stringify({thin,wide}));
 if(scene.wallPoints.geometry!==geometry)throw Error('Bias rebuilt wall geometry');
 for(const patch of [{gapFillForegroundLimit:false},{occludedBackground:false},{wallFillPointLimit:0},{gapFillBrightness:0}]){
  scene.applySettings({...settings,...patch});draw();if(scene.wallPoints.visible)throw Error('Disabled/zero walls still draw');
 }
 scene.applySettings(settings);scene.setIdleVis(0);if(scene.wallPoints.visible)throw Error('Idle wall draws');scene.setIdleVis(1);
 // CPU framing must read exactly the uploaded surface-aware band index.
 scene.bandData.fill(0);const near=.9,index=scene.depthBandData[Math.floor(near*1024)*4];scene.bandData[index*4]=255;
 scene.applySettings({...settings,intensity:1,xyMove:0,equalDepthMovement:true,depthMove:1,centeredMotion:false,motionWave:0,motionRipple:0,motionBands:0,motionDrift:0,motionSweep:0,motionSwirl:0,motionBreathe:0,motionBandShake:0});scene.uniforms.uDyn.value=1;
 const out=new Float64Array(3);animatedSample(0,0,near,.5,scene.uniforms,scene.bandData,out,0);
 if(Math.abs(out[2]-(near*.6+.11))>1e-6)throw Error('Surface-aware framing used a different band: '+JSON.stringify({out:Array.from(out),index,smart:scene.uniforms.uSmartDepthBands.value}));
 let disposed=false;geometry.addEventListener('dispose',()=>disposed=true);scene.setCloud({...cloud,walls:null});if(!disposed||scene.wallPoints)throw Error('Wall geometry leaked on rebuild');
 bitmap.close();scene.renderer.dispose();
 document.getElementById('result').textContent='PASS: real-outline walls, bias changes endpoint with fixed geometry, worker parity, separate capped point budget, CPU framing parity, idle/off/zero draw skip, cleanup and no WebGL errors.';
}catch(error){document.getElementById('result').textContent='FAIL: '+(error.stack||error);}
</script>
