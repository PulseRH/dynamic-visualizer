<script type="module">

 const cloud={aspect:1,count:3,baseCount:2,positions:new Float32Array(9),colors:new Float32Array(9),rands:new Float32Array(3).fill(.5),fillStarts:new Float32Array([0,0,.8,.5]),fillEnds:new Float32Array([0,0,.2,.5]),fillFractions:new Float32Array([.5]),fillThickness:new Float32Array([.3,1]),fillForeground:new Float32Array([0,0,0,2]),sideMask,
