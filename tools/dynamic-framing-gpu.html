<!doctype html><meta charset="utf-8"><title>Dynamic framing GPU regression</title>
<canvas id="cloud" style="width:400px;height:300px"></canvas><pre id="result">Running…</pre>
<script type="module">
import { VisualScene } from '../src/js/scene.js';
import { getAll } from '../src/js/settings.js';
const out = document.querySelector('#result');
try {
  const scene = new VisualScene(document.querySelector('#cloud'));
  scene.renderer.setSize(400, 300, false);
  scene.camera.aspect = 4 / 3;
  const positions=[], colors=[], rands=[];
  for(let y=0;y<181;y++) for(let x=0;x<321;x++) {
    positions.push((x/320-.5)*1.8,y/180-.5,.95-.85*x/320);
    colors.push(.7,.7,.7); rands.push(((x*37+y*19)%101)/101);
  }
  scene.setCloud({ count: rands.length, aspect: 1.8, positions: new Float32Array(positions),
    colors: new Float32Array(colors), rands: new Float32Array(rands) });
  scene.spacingWorld = .0056;
  const settings = { ...getAll(), keepScreenCovered: true, fillStrength: 1, framingSmoothing: 0, depthScale: .8, depthMove: 1,
    bandMap: 'depth', intensity: 1, quietMovement: 1, energyResponse: 1,
    sizePulse: 0, boost: 0, hueReaction: 0, hueCycle: 0, vibrancyPulse: 0,
    musicParallax: 0, cursorRipple: false, pointSize: 2,
    motionWave: 0, motionRipple: 0, motionBands: 0, motionDrift: 0, motionSweep: 0,
    xyMove: 0, motionSwirl: 1, motionBreathe: 1, motionBandShake: 0 };
  scene.applySettings(settings);
  const gl = scene.renderer.getContext();
  const pixels = new Uint8Array(400 * 300 * 4);
  for (const direction of [-1, 1]) {
    scene.pointer.x = direction; scene.pointer.tx = direction;
    scene.pointer.y = direction * .5; scene.pointer.ty = direction * .5;
    scene.render({ bands: new Float32Array(scene.bandCount).fill(.8), energy: 1, loud: 1 }, 4);
    gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    let lit=0, border=0;
    for (let y=0;y<300;y++) for(let x=0;x<400;x++) {
      if(x>=4 && x<=395 && y>=4 && y<=295) continue;
      const i=(y*400+x)*4;
      border++;
      if(Math.max(pixels[i],pixels[i+1],pixels[i+2])>20) lit++;
    }
    if(lit/border<.95) throw new Error(`Exposed screen border: ${(100*lit/border).toFixed(1)}% covered`);
    if(gl.getError()!==gl.NO_ERROR) throw new Error('WebGL error');
  }
  scene.applySettings({...settings,fillStrength:.6,framingSmoothing:.6});
  scene.render({bands:new Float32Array(scene.bandCount).fill(.3),energy:.3,loud:.3},4);
  if(!Number.isFinite(scene.camera.zoom) || gl.getError()!==gl.NO_ERROR) throw new Error('Invalid soft framing');
  scene.applySettings({...settings,fillStrength:0,framingSmoothing:1});
  scene.render({bands:new Float32Array(scene.bandCount).fill(.8),energy:1,loud:1},4);
  if(scene.camera.zoom!==1 || scene.camera.projectionMatrix.elements[8]!==0 || scene.camera.projectionMatrix.elements[9]!==0
    || scene.camera.position.z!==scene.camBaseZ) throw new Error('Zero strength did not restore fixed fit');
  out.textContent='PASS: strict borders covered; soft framing renders without WebGL errors; zero strength restores fixed fit.';
} catch(e) { out.textContent='FAIL: '+e.stack; }
</script>
