<!doctype html><meta charset="utf-8"><title>Band seam GPU check</title><canvas id="cloud"></canvas><pre id="result">Running…</pre>
<script type="module">
import {VisualScene} from '../src/js/scene.js';
import {getAll} from '../src/js/settings.js';
import {animatedSample} from '../src/js/framing-motion.js';
import * as THREE from '../src/vendor/three.module.js';
try{
 const scene=new VisualScene(document.querySelector('canvas'));
 scene.uniforms.uFillOnlyOpen.value=0;
 scene.uniforms.uFillAdaptive.value=0;
 scene.renderer.setSize(400,300,false);scene.camera.aspect=4/3;scene.camera.updateProjectionMatrix();
 const start=[-.08,0,.46,.2],end=[.08,0,.52,.8];
 scene.setCloud({count:3,baseCount:2,aspect:4/3,positions:new Float32Array([...start.slice(0,3),...end.slice(0,3),0,0,.49]),colors:new Float32Array(9).fill(.3),rands:new Float32Array([.2,.8,.5]),fillStarts:new Float32Array(start),fillEnds:new Float32Array(end),fillFractions:new Float32Array([.5])});
 const gl=scene.renderer.getContext(),a=new Float64Array(3),b=new Float64Array(3),pixels=new Uint8Array(400*300*4);
 for(const map of ['depth','horizontal','vertical','radial'])for(const invert of [false,true]){
  scene.applySettings({...getAll(),bands:64,bandMap:map,invertBands:invert,depthScale:.35,depthShading:0,hueReaction:0,hueCycle:0,glow:1,boost:0,motionWave:.5,motionSwirl:.8,motionBreathe:.5,motionBandShake:1,xyMove:1,depthMove:2,intensity:2,centeredMotion:true,equalDepthMovement:true});
  scene.uniforms.uFillOnlyOpen.value=0;scene.uniforms.uFillAdaptive.value=0;scene.points.visible=false;
  scene.uniforms.uWaveTime.value=1.3;scene.uniforms.uXYTime.value=.8;scene.uniforms.uSize.value=3;scene.uniforms.uCamZ.value=1.9;
  scene.uniforms.uCursor.value.set(.1,-.1,.5);
  for(let band=0;band<scene.bandCount;band++)scene.bandData[band*4]=band%2 ? 255:0;
  scene.bandTex.needsUpdate=true;
  animatedSample(...start,scene.uniforms,scene.bandData,a,0);animatedSample(...end,scene.uniforms,scene.bandData,b,0);
  scene.camera.updateMatrixWorld();
  const target=new THREE.Vector3((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2).project(scene.camera);
  const tx=(target.x*.5+.5)*400,ty=(target.y*.5+.5)*300;
  scene.renderer.render(scene.scene,scene.camera);gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  let weight=0,cx=0,cy=0;
  for(let y=0;y<300;y++)for(let x=0;x<400;x++){const i=(y*400+x)*4,w=pixels[i]+pixels[i+1]+pixels[i+2];weight+=w;cx+=(x+.5)*w;cy+=(y+.5)*w;}
  if(!weight||Math.hypot(cx/weight-tx,cy/weight-ty)>1)throw new Error(`Fill did not follow both endpoints: ${map} ${invert}, ${cx/weight},${cy/weight} vs ${tx},${ty}`);
  if(gl.getError()!==gl.NO_ERROR)throw new Error('WebGL error');
 }
 // Opening the seam must add distance between samples, never enlarge them.
 scene.applySettings({...getAll(),intensity:0,depthScale:0,depthShading:0,hueReaction:0,hueCycle:0,glow:1,boost:0,sizePulse:0,motionWave:0,motionRipple:0,motionBands:0,motionDrift:0,motionSwirl:0,motionBreathe:0,motionSweep:0,motionBandShake:0,xyMove:0,depthMove:0});
 scene.uniforms.uCursor.value.set(0,0,0);scene.uniforms.uSize.value=3;
 scene.uniforms.uFillOnlyOpen.value=0;
 scene.uniforms.uFillAdaptive.value=0;
 const narrow=new Uint8Array(pixels.length);
 for(const width of [.02,.6]){
  scene.setCloud({count:3,baseCount:2,aspect:4/3,positions:new Float32Array([-width,0,.5,width,0,.5,0,0,.5]),colors:new Float32Array(9).fill(.3),rands:new Float32Array([.2,.8,.5]),fillStarts:new Float32Array([-width,0,.5,.2]),fillEnds:new Float32Array([width,0,.5,.8]),fillFractions:new Float32Array([.5])});
  scene.points.visible=false;scene.renderer.render(scene.scene,scene.camera);gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  if(width===.02){if(!pixels.some((v,i)=>i%4!==3&&v>0))throw new Error('Size comparison rendered no point');narrow.set(pixels);}
  else if(!pixels.every((v,i)=>v===narrow[i]))throw new Error('Wider seam enlarged or changed the fill point');
 }
 scene.uniforms.uFillBrightness.value=0;
 scene.renderer.render(scene.scene,scene.camera);gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 if(pixels.some((v,i)=>i%4!==3 && v!==0))throw new Error('Zero fill brightness did not suppress hotspots');
 scene.applySettings({...getAll(),gapFillBrightness:.4,gapFillDensity:24,gapFillRows:6});
 if(Math.abs(scene.uniforms.uFillBrightness.value-.1)>1e-6)throw new Error('Fill density brightness compensation failed');
 // Flat/closed bands must have no added contour, even when the whole pair
 // moves toward the camera. A different band shaking away must activate fill.
 scene.applySettings({...getAll(),gapFillOnlyOpen:true,gapFillBrightness:1,gapFillDensity:12,gapFillRows:3,bands:64,bandMap:'horizontal',invertBands:false,intensity:1,depthScale:0,depthMove:1,xyMove:0,centeredMotion:false,equalDepthMovement:true,boost:0,sizePulse:0,depthShading:0,hueReaction:0,hueCycle:0,motionWave:0,motionRipple:0,motionBands:0,motionDrift:0,motionSwirl:0,motionBreathe:0,motionSweep:0,motionBandShake:0});
 scene.uniforms.uSize.value=3;scene.uniforms.uCursor.value.set(0,0,0);
 scene.uniforms.uFillAdaptive.value=0;
 scene.setCloud({count:3,baseCount:2,aspect:4/3,positions:new Float32Array([.15,.05,.5,.17,.05,.5,.16,.05,.5]),colors:new Float32Array(9).fill(.3),rands:new Float32Array([.2,.8,.5]),fillStarts:new Float32Array([.15,.05,.5,.2]),fillEnds:new Float32Array([.17,.05,.5,.8]),fillFractions:new Float32Array([.5])});
 scene.points.visible=false;
 scene.uniforms.uFillSpacing.value=.02;
 const drawWeight=()=>{scene.bandTex.needsUpdate=true;scene.renderer.render(scene.scene,scene.camera);gl.readPixels(0,0,400,300,gl.RGBA,gl.UNSIGNED_BYTE,pixels);return pixels.reduce((sum,v,i)=>sum+(i%4===3 ? 0:v),0);};
 for(const level of [0,128,255]){
  for(let band=0;band<scene.bandCount;band++)scene.bandData[band*4]=level;
  if(drawWeight()!==0)throw new Error('Closed/shared-motion bands left an outline');
 }
 scene.uniforms.uExtraLayers.value.w=1;
 const movingBand=Math.floor((.17/(4/3)+.5)*scene.bandCount);
 for(let band=0;band<scene.bandCount;band++)scene.bandData[band*4]=band===movingBand ? 255:0;
 let opened=false;
 for(let time=0;time<10;time++){scene.uniforms.uXYTime.value=time*.3;if(drawWeight()>0)opened=true;}
 if(!opened)throw new Error('Open moving gap did not reveal fill');
 // Isolate four ranks to count visible points independently of overlap.
 const starts=[],ends=[],positions=[.165,0,.5,.168,0,.5];
 for(const y of [-.12,-.04,.04,.12]){starts.push(.165,y,.5,.2);ends.push(.168,y,.5,.8);positions.push(.1665,y,.5);}
 scene.setCloud({count:6,baseCount:2,aspect:4/3,positions:new Float32Array(positions),colors:new Float32Array(18).fill(.3),rands:new Float32Array([.2,.8,0,.25,.5,.75]),fillStarts:new Float32Array(starts),fillEnds:new Float32Array(ends),fillFractions:new Float32Array(4).fill(.5)});
 scene.points.visible=false;scene.uniforms.uFillAdaptive.value=1;scene.uniforms.uFillSamples.value=4;scene.uniforms.uZMove.value=0;scene.uniforms.uFillBrightness.value=1;scene.uniforms.uSize.value=2;
 scene.uniforms.uFillSpacing.value=.003;
 for(let band=0;band<scene.bandCount;band++)scene.bandData[band*4]=band===40 ? 255:0;
 let bestTime=0,bestDistance=0;scene.uniforms.uIntensity.value=1.5;
 for(let time=0;time<40;time++){
  scene.uniforms.uXYTime.value=time*.2;
  animatedSample(.165,0,.5,.2,scene.uniforms,scene.bandData,a,0);animatedSample(.168,0,.5,.8,scene.uniforms,scene.bandData,b,0);
  const distance=Math.hypot(a[0]-b[0],a[1]-b[1]);if(distance>bestDistance){bestDistance=distance;bestTime=time*.2;}
 }
 scene.uniforms.uXYTime.value=bestTime;
 const counts=[];
 for(const strength of [0,.015,.06,1.5]){
  scene.uniforms.uIntensity.value=strength;let count=0;
  for(let rank=0;rank<4;rank++){scene.fillPoints.geometry.setDrawRange(rank,1);if(drawWeight()>0)count++;}
  counts.push(count);
 }
 if(counts[0]!==0 || counts[3]!==4 || counts[1]>=counts[3] || counts.some((v,i)=>i>0&&v<counts[i-1]))throw new Error('Width-adaptive count failed: '+counts);
 // A low maximum must not divide away coverage in moderately open seams.
 scene.uniforms.uFillSamples.value=3;
 scene.fillPoints.geometry.attributes.aRand.array.set([0,1/3,2/3,.99]);
 scene.fillPoints.geometry.attributes.aRand.needsUpdate=true;
 let moderateStrength=0;
 for(let strength=.01;strength<.5;strength+=.005){
  scene.uniforms.uIntensity.value=strength;
  animatedSample(.165,0,.5,.2,scene.uniforms,scene.bandData,a,0);animatedSample(.168,0,.5,.8,scene.uniforms,scene.bandData,b,0);
  if(Math.hypot(a[0]-b[0],a[1]-b[1])/.003-1>=1){moderateStrength=strength;break;}
 }
 if(!moderateStrength)throw new Error('Could not generate moderate opening');
 let moderateCount=0;
 for(let rank=0;rank<3;rank++){scene.fillPoints.geometry.setDrawRange(rank,1);if(drawWeight()>0)moderateCount++;}
 if(moderateCount===0 || moderateCount===3)throw new Error('Moderate gaps need useful coverage without saturating: '+moderateCount);
 scene.fillPoints.geometry.setDrawRange(0,1);
 const compensatedLight=drawWeight();scene.uniforms.uFillAdaptive.value=0;
 const fullLight=drawWeight();scene.uniforms.uFillAdaptive.value=1;
 if(!(compensatedLight>0 && compensatedLight<fullLight))throw new Error('Narrow-gap highlight compensation failed');
 scene.uniforms.uFillAdaptive.value=.5;const blendedLight=drawWeight();scene.uniforms.uFillAdaptive.value=1;
 if(!(compensatedLight<blendedLight && blendedLight<fullLight))throw new Error('Match strength did not blend narrow-gap suppression');
 scene.uniforms.uFillSpacing.value=.1;
 for(let rank=0;rank<3;rank++){scene.fillPoints.geometry.setDrawRange(rank,1);if(drawWeight()>0)throw new Error('Nearly coincident neighbours overrode normal spacing');}
 scene.setCloud({count:2,aspect:4/3,positions:new Float32Array([...start.slice(0,3),...end.slice(0,3)]),colors:new Float32Array(6).fill(.3),rands:new Float32Array([.2,.8])});
 if(scene.fillPoints)throw new Error('Fill geometry retained after disabling');
 document.querySelector('#result').textContent='PASS: width-adaptive counts '+counts+'; closed/shared-motion seams have no outline; endpoint motion, size, brightness and cleanup work.';
 scene.renderer.dispose();
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;}
</script>
