<!doctype html><meta charset="utf-8"><canvas></canvas><pre id="result">RUNNING</pre>
<script type="module">
import {sampleImageToCloud} from '../src/js/sampler.js';
import {buildCloud} from '../src/js/cloud-builder.js';
import {prepareOcclusion} from '../src/js/occlusion.js';
import {VisualScene} from '../src/js/scene.js';
import {getAll} from '../src/js/settings.js';
try{
  const w=64,h=40,depth={w,h,data:new Float32Array(w*h)},labels=new Uint16Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    depth.data[y*w+x]=x<29 ? .85:x>31 ? .15:.85-(x-28)*(.7/3);
    if(x<30)labels[y*w+x]=1;
  }
  const image=new OffscreenCanvas(320,200),ctx=image.getContext('2d');ctx.fillStyle='#144879';ctx.fillRect(0,0,320,200);ctx.fillStyle='#e43120';ctx.fillRect(0,0,150,200);
  const reconstruction=prepareOcclusion(depth,2.5);reconstruction.rgb=new Uint8Array(w*h*3).fill(180);
  const mapping={bandMap:'depth',bands:20,bandDistribution:0,smartDepthBands:false,gapFillDepthLimit:.3,gapFillDensity:5,gapFillRows:3,gapFillSpread:2,reconstruction,objectMasks:{labels,count:1},reconstructionPointLimit:40000,reconstructionWidth:2.5};
  const raw=sampleImageToCloud(image,depth,20000,1,mapping),clean=sampleImageToCloud(image,depth,20000,1,{...mapping,cleanDepthEdges:true});
  const intermediate=cloud=>{let count=0;for(let i=0;i<cloud.baseCount;i++){const [x,y,z]=cloud.positions.subarray(i*3,i*3+3);if(Math.abs(y)<.4&&z>.16&&z<.84)count++;}return count;};
  if(intermediate(raw)<100||intermediate(clean)!==0)throw Error(`Phantom depth strips remain: ${intermediate(raw)} -> ${intermediate(clean)}`);
  let sides=0;
  for(let i=0;i<clean.fillFractions.length;i++)if(Math.abs(clean.fillStarts[i*4+1])<.4 && Math.abs(clean.fillStarts[i*4+2]-clean.fillEnds[i*4+2])>.3){
    sides++;
    if(Math.abs(clean.fillForeground[i*4+3])!==2 || clean.fillThickness[i*2+1]!==1)throw Error('Cleaned edge lost foreground ownership or thickness control');
    if(clean.fillForeground[i*4]<.8 || clean.fillForeground[i*4+2]>.2)throw Error('Sidewall uses background instead of red foreground');
  }
  if(sides<50)throw Error('Cleaned edge removed the foreground sidewall: '+sides);
  const withoutReconstruction=sampleImageToCloud(image,depth,20000,1,{...mapping,reconstruction:null,cleanDepthEdges:true});
  if(!withoutReconstruction.fillForeground.some(v=>Math.abs(v)===2))throw Error('Depth-only cleanup removed all sidewalls');
  if(!clean.reconstruction?.positions.length || !clean.reconstruction.positions.every((v,i)=>v===raw.reconstruction.positions[i]))throw Error('Cleaning removed or moved the generated background');
  const walls=new Set();
  for(let i=0;i<clean.fillFractions.length;i++){
    const foreground=clean.fillForeground[i*4+3];if(!foreground)continue;
    const first=foreground>0 ? clean.fillStarts:clean.fillEnds,last=foreground>0 ? clean.fillEnds:clean.fillStarts;
    walls.add([...first.subarray(i*4,i*4+4),...last.subarray(i*4,i*4+4),...clean.fillThickness.subarray(i*2,i*2+2)].join(','));
  }
  let bound=0;
  const hidden=clean.reconstruction;
  for(let i=0;i<hidden.rands.length;i++)if(hidden.sideRears[i*4+3]>=0){
    bound++;
    if(!walls.has([...hidden.sideFronts.subarray(i*4,i*4+4),...hidden.sideRears.subarray(i*4,i*4+4),...hidden.sideThickness.subarray(i*2,i*2+2)].join(',')))throw Error('Occlusion references a wall that was not emitted');
  }
  if(!bound)throw Error('No hidden points matched real wall endpoints');
  const worker=await buildCloud(image,depth,20000,1,{...mapping,cleanDepthEdges:true});
  for(const key of ['positions','fillThickness','fillForeground'])if(!worker[key].every((v,i)=>v===clean[key][i])||worker[key].length!==clean[key].length)throw Error('Worker mismatch: '+key);
  for(const key of ['sideFronts','sideRears','sideThickness'])if(!worker.reconstruction[key].every((v,i)=>v===clean.reconstruction[key][i]))throw Error('Worker lost side binding '+key);
  const restored=sampleImageToCloud(image,depth,20000,1,{...mapping,cleanDepthEdges:false});
  if(!restored.positions.every((v,i)=>v===raw.positions[i]))throw Error('Off failed to restore original depth');
  const scene=new VisualScene(document.querySelector('canvas'));scene.setCloud(clean);
  scene.applySettings({...getAll(),cleanDepthEdges:true,depthScale:0,surfaceCohesion:0,bandMap:'depth',bands:20,occludedBackground:true,reconstructionBrightness:1,keepScreenCovered:false,hideBackdrop:true,quietMovement:1,intensity:2,depthMove:3,idleSleep:false});
  const bands=Float32Array.from({length:20},(_,i)=>.5+.4*Math.sin(i*1.7));
  scene.render({bands,energy:1,loud:1},1);
  const gl=scene.renderer.getContext();if(gl.getError()!==gl.NO_ERROR)throw Error('WebGL error');
  document.querySelector('#result').textContent=`PASS: ${intermediate(raw)} intermediate wall points collapse to front/back surfaces; ${sides} foreground-owned wall points cross a cleaned depth jump larger than the ordinary limit; hidden background unchanged; worker parity, neutral off and audio-only GPU rendering pass.`;
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.stack;}
</script>
