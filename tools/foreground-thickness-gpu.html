<!doctype html><meta charset="utf-8"><canvas id="gl"></canvas><pre id="result">RUNNING</pre>
<script type="module">
import {VisualScene} from '../src/js/scene.js';

import {buildCloud} from '../src/js/cloud-builder.js';
import {estimateFillThickness} from '../src/js/fill-thickness.js';
import {Vector3} from '../src/vendor/three.module.js';
try{
 const scene=new VisualScene(document.getElementById('gl'));
 scene.renderer.setSize(300,300,false);scene.camera.aspect=1;scene.camera.updateProjectionMatrix();
 const base={...getAll(),occludedBackground:true,gapFillForegroundLimit:true,gapFillManualLimit:false,gapFillThicknessBias:1,gapFillOnlyOpen:false,gapFillAdaptive:0,gapFillBrightness:1,gapFillRows:3,gapFillDensity:12,depthShape:0,depthScale:.4,intensity:0,depthMove:1,xyMove:0,sizePulse:0,boost:0,depthShading:0,hueReaction:0,hueCycle:0,audioCurvature:0,dollyZoom:0,centeredMotion:false,equalDepthMovement:true,motionWave:0,motionRipple:0,motionBands:0,motionDrift:0,motionSwirl:0,motionBreathe:0,motionSweep:0,motionBandShake:0};
 scene.applySettings(base);scene.uniforms.uSize.value=3;scene.uniforms.uCursor.value.set(0,0,0);
 const positions=[-.12,0,.7,.12,0,.3],starts=[],ends=[],fractions=[.2,.4,.6,.8];
 for(const [i,t] of fractions.entries()){const y=(i-1.5)*.08;positions.push(-.12+.24*t,y,.7-.4*t);starts.push(-.12,y,.7,.2);ends.push(.12,y,.3,.8);}
 scene.setCloud({count:6,baseCount:2,aspect:1,positions:new Float32Array(positions),colors:new Float32Array(Array.from({length:18},(_,i)=>i%3===2 ? .6:0)),rands:new Float32Array([.2,.8,.1,.2,.3,.4]),fillStarts:new Float32Array(starts),fillEnds:new Float32Array(ends),fillFractions:new Float32Array(fractions),fillThickness:new Float32Array([.08,1,.08,1,.08,1,.08,1]),fillForeground:new Float32Array([.6,0,0,1,.6,0,0,1,.6,0,0,1,.6,0,0,1])});
 scene.uniforms.uFillSpacing.value=.004;

 const verifyPositions=(firstZ,lastZ,limit,weight=1,frontFirst=true)=>{

     for(let p=0;p<pixels.length;p+=4){const light=pixels[p]+pixels[p+1]+pixels[p+2],pixel=p/4;sum+=light;cx+=(pixel%300+.5)*light;cy+=(Math.floor(pixel/300)+.5)*light;}
     const fraction=1-weight+weight*Math.min(1,limit/Math.max(Math.abs(lastZ-firstZ),1e-6));
     const t=fractions[i],wallT=frontFirst ? t*fraction:1-(1-t)*fraction;
     const expected=new Vector3(-.12+.24*t,(i-1.5)*.08,firstZ+(lastZ-firstZ)*wallT).project(scene.camera);

     if(error>1.1)throw Error('Wrong shortened wall position at sample '+i+': '+error.toFixed(2)+' px');
   }
 };

 scene.applySettings({...base,depthScale:.8});verifyPositions(.56,.24,.08);
 scene.applySettings({...base,gapFillThicknessBias:.5});verifyPositions(.28,.12,.04);

 scene.applySettings({...base,gapFillForegroundLimit:false,gapFillManualLimit:true,gapFillThickness:.6});verifyPositions(.28,.12,.096);
 scene.applySettings({...base,gapFillForegroundLimit:false,gapFillManualLimit:true,gapFillThickness:1});verifyPositions(.28,.12,.16);
 scene.applySettings({...base,gapFillManualLimit:true,gapFillThickness:.25});verifyPositions(.28,.12,.04);
 scene.applySettings({...base,gapFillManualLimit:true,gapFillThickness:.9});verifyPositions(.28,.12,.08);
 scene.applySettings({...base,gapFillManualLimit:true,gapFillThickness:0});if(counts().some(Boolean))throw Error('Zero manual thickness still draws foreground edges');
 scene.applySettings(base);
 scene.camera.position.set(0,0,-2);scene.camera.lookAt(0,0,0);
 verifyPositions(.28,.12,.08);
 scene.camera.position.set(1.2,0,2);scene.camera.lookAt(0,0,0);
 scene.applySettings({...base,depthScale:0,intensity:1.5,bands:4,bandMap:'depth',bandDistribution:0,invertBands:false});scene.uniforms.uDyn.value=1;
 scene.bandData.fill(0);scene.bandData[4]=255;
 verifyPositions(0,.165,.08);
 geometry.setDrawRange(0,1);draw();if(!(channels()[0]>0&&channels()[2]===0))throw Error('Audio reversal changed the red wall into background blue');
 scene.applySettings(base);
 const begin=geometry.attributes.aFillStart,end=geometry.attributes.aFillEnd,foreground=geometry.attributes.aFillForeground;
 for(let i=0;i<4;i++){begin.array[i*4+2]=.3;end.array[i*4+2]=.7;foreground.array[i*4+3]=-1;}
 begin.needsUpdate=end.needsUpdate=foreground.needsUpdate=true;
 verifyPositions(.12,.28,.08,1,false);
 geometry.setDrawRange(3,1);draw();if(!(channels()[0]>0&&channels()[2]===0))throw Error('End-owned foreground lost its colour');
 for(let i=0;i<4;i++){begin.array[i*4+2]=.7;end.array[i*4+2]=.3;foreground.array[i*4+3]=1;}
 begin.needsUpdate=end.needsUpdate=foreground.needsUpdate=true;
 const shell=geometry.attributes.aFillThickness;
 for(let i=0;i<4;i++)shell.array[i*2]=.016;shell.needsUpdate=true;
 verifyPositions(.28,.12,.016);
 for(let i=0;i<4;i++){shell.array[i*2]=.08;shell.array[i*2+1]=.5;}shell.needsUpdate=true;
 verifyPositions(.28,.12,.08,.5);
 for(const weight of [.009,.011]){
   for(let i=0;i<4;i++)shell.array[i*2+1]=weight;shell.needsUpdate=true;
   verifyPositions(.28,.12,.08,weight);
 }
 for(let i=0;i<4;i++){shell.array[i*2]=.08;shell.array[i*2+1]=0;}shell.needsUpdate=true;
 if(counts().join()!=='1,1,1,1')throw Error('Interior band seams were cut');
 scene.applySettings({...base,gapFillManualLimit:true,gapFillThickness:0});if(counts().join()!=='1,1,1,1')throw Error('Manual limit hid unclassified interior seams');scene.applySettings(base);
 shell.array.fill(0);shell.needsUpdate=true;
 if(counts().join()!=='1,1,1,1')throw Error('Background fill was shortened');
 for(let i=0;i<4;i++){shell.array[i*2]=.08;shell.array[i*2+1]=1;}shell.needsUpdate=true;geometry.setDrawRange(0,4);
 scene.applySettings({...base,gapFillForegroundLimit:false});draw();const neutral=pixels.slice();
 if(!(channels()[2]>0&&channels()[0]===0))throw Error('Disabled Auto thickness changed ordinary seam colour');
 scene.applySettings({...base,occludedBackground:false});draw();if(!pixels.every((v,i)=>v===neutral[i]))throw Error('Disabled reconstruction affected fill');
 if(scene.fillPoints.geometry!==geometry)throw Error('Live thickness settings rebuilt geometry');
 const canvas=document.createElement('canvas');canvas.width=384;canvas.height=256;const ctx=canvas.getContext('2d');ctx.fillStyle='#a58176';ctx.fillRect(0,0,384,256);
 const image=await createImageBitmap(canvas),depth={w:96,h:64,data:new Float32Array(96*64).fill(.15)};
 for(let y=12;y<52;y++)for(let x=36;x<60;x++)depth.data[y*96+x]=.9;
 const reconstruction=prepareOcclusion(depth,2.5);reconstruction.rgb=new Uint8Array(96*64*3).fill(100);delete reconstruction.mask;
 Object.assign(reconstruction,estimateFillThickness(depth,reconstruction));
 const options={reconstruction,bands:16},direct=sampleImageToCloud(image,depth,40000,1,options),worker=await buildCloud(image,depth,40000,1,options);
 for(const key of ['positions','colors','rands','fillStarts','fillEnds','fillFractions','fillThickness','fillForeground'])if(!direct[key].every((v,i)=>v===worker[key][i])||direct[key].length!==worker[key].length)throw Error('Worker mismatch '+key);
 if(!worker.fillThickness.includes(0)||!worker.fillThickness.some(v=>v>0))throw Error('Worker lost shell estimates');
 image.close();scene.renderer.dispose();

}catch(error){document.getElementById('result').textContent='FAIL: '+(error.stack||error);}
</script>
